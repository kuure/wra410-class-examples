<!doctype html>

<html lang="en">

<head>

	<title>JavaScript Form Element Demo</title>

	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="style.css">

</head>


<body>

	<h1>JavaScript Form Demo</h1>


	<form>

		<fieldset>

			<label for="firstName" class="one">First Name:</label>
			<input type="text" id="firstName" class="two" />

			<label for="lastName" class="three">Last Name:</label>
			<input type="text" id="lastName" class="four" />

			<label for="major" class="five">Major:</label>
			<select id="major" class="six">
				<option value="xa" selected>Experience Architecture (XA)</option>
				<option value="p2w">Professional and Public Writing (P2W))</option>
				<option value="other">Other</option>
			</select>

		</fieldset>

	</form>


	<button>Clear Inputs</button>





	<script>

		// define variables for all the elements we need to access
		const firstName = document.querySelector("#firstName");
		const lastName = document.querySelector("#lastName");
		const major = document.querySelector("#major");
		const button = document.querySelector("button");

		// print the contents of the firstName box to the 
		// console when any text is entered
		firstName.addEventListener("input", () => {
			console.log(firstName.value)
		})


		// print the contents of the lastName box to the 
		// console when any text is entered
		lastName.addEventListener("input", () => {
			console.log(lastName.value)
		})


		// message when you "focus" the last name input
		lastName.addEventListener("focus", () => {
			console.log("Last Name Focused")
		})


		// message when you "blur" the last name input
		lastName.addEventListener("blur", () => {
			console.log("Last Name Blurred")
		})


		// print the current value to the console when changed
		major.addEventListener("change", () => {
			console.log("Drop Down Changed")
			console.log(major.value)
		})

		// clear the form contents and reset the drop-down
		// when the button is clicked
		button.addEventListener("click", () => {
			console.log("Resetting Form Fields");
			firstName.value = "";
			lastName.value = "";
			// make sure that the drop down is set to the first item
			major.selectedIndex = 0;
		});

	</script>

</body>

</html>
