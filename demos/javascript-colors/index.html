<!doctype html>

<html lang="en-US">

<head>

	<title>JavaScript Colors</title>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>


	<h1>JavaScript Colors</h1>

	<p>Set this page up so it will apply a background color based on the
		slider values</p>
	<div>
		<label for="rslider">Red Value:</label>
		<input type="range" id="rslider" min="0" max="255" step="1" value="0">
	</div>
	<div>
		<label for="gslider">Green Value:</label>
		<input type="range" id="gslider" min="0" max="255" step="1" value=0>
	</div>
	<div>
		<label for="bslider">Blue Value:</label>
		<input type="range" id="bslider" min="0" max="255" step="1" value=0>
	</div>

	<p>How about a random color?</p>
	<button>Random Color</button>

	<script src="js/script.js"></script>

</body>

</html>
